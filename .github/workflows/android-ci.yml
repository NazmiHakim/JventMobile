name: Android CI

on:
  push:
    branches: [ "Jvent" ]
  pull_request:
    branches: [ "Jvent" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v3

      - name: Siapkan JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Beri Izin Eksekusi untuk gradlew
        run: chmod +x gradlew

      - name: Build dengan Gradle
        run: ./gradlew build

      - name: Jalankan Unit Tests
        run: ./gradlew test